name: HelloWatch
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "3"
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
targets:
  HelloPhone:
    type: application
    platform: iOS
    sources: [Phone]
    settings:
      base:
        PRODUCT_NAME: HelloWatch
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basimnassermu.hellowatch
        INFOPLIST_KEY_CFBundleDisplayName: HelloWatch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  HelloWatchApp:
    type: application
    platform: watchOS
    sources: [Watch]
    settings:
      base:
        PRODUCT_NAME: HelloWatchApp
        PRODUCT_BUNDLE_IDENTIFIER: io.github.basimnassermu.hellowatch.watchkitapp
        INFOPLIST_KEY_CFBundleDisplayName: HelloWatch
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: io.github.basimnassermu.hellowatch
        TARGETED_DEVICE_FAMILY: "4"
